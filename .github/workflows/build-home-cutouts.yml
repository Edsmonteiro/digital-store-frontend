name: Preparar recortes do carrossel

on:
  push:
    branches: [fix/home-slide-recortes]
    paths:
      - "scripts/build_home_cutouts.py"
      - ".github/workflows/build-home-cutouts.yml"

permissions:
  contents: write

jobs:
  cutouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/home-cutouts-requirements.txt"
      - name: Instalar ferramenta de recorte
        run: pip install -r scripts/home-cutouts-requirements.txt
      - name: Recortar imagens originais
        run: python scripts/build_home_cutouts.py
      - name: Adicionar assets gerados à branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/store/home-slide-4-cutout.png public/store/home-slide-7-cutout.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: adicionar recortes transparentes para o carrossel"
            git push
          fi
